<script src="/pwa-install.js" defer></script>

<--- PWA Status Check -->
<script>
  // Deteksi koneksi
  window.addEventListener('online', () => {
    document.body.classList.remove('offline');
    console.log('📡 Online - All features available');
  });
  
  window.addEventListener('offline', () => {
    document.body.classList.add('offline');
    console.log('📡 Offline - Using cached data');
  });
  
  // Deteksi baterai
  if ('getBattery' in navigator) {
    navigator.getBattery().then(battery => {
      console.log(`🔋 Battery: ${Math.round(battery.level * 100)}%`);
    });
  }
  
  // Deteksi memory
  if ('deviceMemory' in navigator) {
    console.log(`💾 Device RAM: ${navigator.deviceMemory}GB`);
  }
  
  // Register Background Sync
  if ('serviceWorker' in navigator && 'sync' in registration) {
    navigator.serviceWorker.ready.then(registration => {
      registration.sync.register('sync-location');
      registration.sync.register('sync-trips');
      console.log('🔄 Background sync registered');
    });
  }
  
  // Request Notification Permission
  if ('Notification' in window && Notification.permission === 'default') {
    setTimeout(() => {
      Notification.requestPermission().then(permission => {
        console.log(`🔔 Notification: ${permission}`);
      });
    }, 10000); // Minta setelah 10 detik
  }
</script>

<--- PWA Shortcuts -->
<script>
  // Handle PWA shortcuts
  const params = new URLSearchParams(window.location.search);
  const action = params.get('action');
  
  if (action === 'navigate') {
    console.log('🧭 Opening navigation mode');
  } else if (action === 'track') {
    console.log('🏃 Opening activity tracking');
  } else if (action === 'explore') {
    console.log('🔍 Opening explore mode');
  }
</script>
