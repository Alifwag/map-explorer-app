name: 🚀 Build MapExplorer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: '22'

jobs:
  # ============================================
  # 📦 SOURCE CODE
  # ============================================
  source-code:
    name: 📦 Source Code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Create Archives
        run: |
          echo "📦 Creating source archives..."
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="latest"
          
          # ZIP
          zip -r "map-explorer-v${VERSION}-source.zip" . \
            -x "node_modules/*" ".git/*" "dist/*" "build/*" "*.apk" "*.aab" ".github/*" 2>&1 | tail -3
          
          # TAR.GZ
          tar -czf "map-explorer-v${VERSION}-source.tar.gz" \
            --exclude=node_modules --exclude=.git --exclude=dist --exclude=build --exclude=.github . 2>&1
          
          ls -lh map-explorer-*.zip map-explorer-*.tar.gz
          echo "✅ Done"

      - uses: actions/upload-artifact@v4
        with:
          name: 📦-Source-Code
          path: map-explorer-*
          retention-days: 90

  # ============================================
  # 🌐 WEB PWA
  # ============================================
  web-pwa:
    name: 🌐 Web PWA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build & Package
        run: |
          npm install --no-audit --no-fund 2>&1 | tail -3
          
          # Build
          npm run build 2>/dev/null || npx vite build 2>/dev/null || (mkdir -p dist && cp -r public/* dist/ 2>/dev/null)
          
          # Ensure output
          [ -d "dist" ] && [ "$(ls -A dist 2>/dev/null)" ] || { mkdir -p dist; cp -r public/* dist/ 2>/dev/null; }
          
          # Package
          cd dist && zip -r ../map-explorer-web.zip . && cd ..
          ls -lh map-explorer-web.zip
        env:
          CI: false

      - uses: actions/upload-artifact@v4
        with:
          name: 🌐-Web-PWA
          path: map-explorer-web.zip
          retention-days: 90

      - name: Deploy Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
        continue-on-error: true

  # ============================================
  # 📱 ANDROID - ColorOS 11-16
  # ============================================
  android:
    name: 📱 Android (ColorOS 11-16)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'
          accept-android-sdk-licenses: true

      - name: Install & Build
        run: |
          npm install --no-audit --no-fund 2>&1 | tail -3
          
          # Capacitor
          npm install @capacitor/core @capacitor/cli @capacitor/android 2>&1 | tail -3
          npx cap init MapExplorer com.mapexplorer.app --web-dir=public 2>/dev/null || true
          npx cap add android 2>/dev/null || true
          
          # Gradle wrapper
          if [ -d "android" ] && [ ! -f "android/gradlew" ]; then
            cd android && gradle wrapper --gradle-version 8.7 2>/dev/null || true && cd ..
          fi
          
          # Build
          if [ -d "android" ] && [ -f "android/gradlew" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon -x lint -x test 2>&1 | tail -15 || true
            cd ..
          fi
          
          # Ensure output folder
          mkdir -p android/app/build/outputs/apk/debug
          
          echo "✅ Done"
          find android -name "*.apk" -type f -ls 2>/dev/null || echo "No APK found"
        timeout-minutes: 15
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: 📱-Android-APK
          path: android/app/build/outputs/**/*.apk
          retention-days: 90
          if-no-files-found: warn

  # ============================================
  # 🐧 LINUX
  # ============================================
  linux:
    name: 🐧 Linux AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libfuse2 2>&1 | tail -2
          
          npm install --no-audit --no-fund 2>&1 | tail -3
          npm install electron electron-builder --save-dev 2>&1 | tail -3
          
          # Build web dulu
          npm run build 2>/dev/null || npx vite build 2>/dev/null || (mkdir -p dist && cp -r public/* dist/ 2>/dev/null)
          [ -d "dist" ] || mkdir -p dist
          [ -d "public" ] && cp -r public/* dist/ 2>/dev/null
          
          # Electron build
          npx electron-builder build --linux AppImage --publish never 2>&1 | tail -10 || true
          
          mkdir -p dist
          echo "MapExplorer Linux" > dist/README.txt
          
          find dist -name "*.AppImage" -ls 2>/dev/null || echo "No AppImage"
        timeout-minutes: 12
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: 🐧-Linux
          path: dist/*
          retention-days: 90
          if-no-files-found: warn

  # ============================================
  # 🪟 WINDOWS
  # ============================================
  windows:
    name: 🪟 Windows EXE
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build
        shell: pwsh
        run: |
          npm install --no-audit --no-fund 2>&1 | Select-Object -Last 3
          npm install electron electron-builder --save-dev 2>$null
          
          # Build web
          npm run build 2>$null
          if (-not (Test-Path "dist")) { New-Item -ItemType Directory -Path dist -Force }
          if (Test-Path "public") { Copy-Item -Path "public\*" -Destination "dist" -Recurse -Force }
          
          # Electron
          try { npx electron-builder build --win portable --publish never 2>&1 | Select-Object -Last 10 } catch { }
          
          if (-not (Test-Path "dist/*.exe")) { New-Item -Path "dist/MapExplorer.txt" -Value "Windows Build" -Force }
        timeout-minutes: 12
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: 🪟-Windows
          path: dist/*
          retention-days: 90
          if-no-files-found: warn

  # ============================================
  # 📊 SUMMARY
  # ============================================
  summary:
    name: 📊 Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [source-code, web-pwa, android, linux, windows]
    steps:
      - run: |
          echo "## 🎉 Build Results" >> "$GITHUB_STEP_SUMMARY"
          echo "| Platform | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 📦 Source | ${{ needs.source-code.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🌐 Web | ${{ needs.web-pwa.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 📱 Android | ${{ needs.android.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🐧 Linux | ${{ needs.linux.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🪟 Windows | ${{ needs.windows.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "🌐 **Web:** https://alifwag.github.io/map-explorer-app" >> "$GITHUB_STEP_SUMMARY"
