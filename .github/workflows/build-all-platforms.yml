name: 🚀 Build MapExplorer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ============================================
  # 📦 SOURCE CODE
  # ============================================
  source-code:
    name: 📦 Source Code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Create Archives
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="latest"
          
          # ZIP
          zip -r "map-explorer-v${VERSION}-source.zip" . \
            -x "node_modules/*" ".git/*" "dist/*" "build/*" "*.apk" ".github/*" 2>&1 | tail -3
          
          # TAR.GZ  
          tar -czf "map-explorer-v${VERSION}-source.tar.gz" \
            --exclude=node_modules --exclude=.git --exclude=dist --exclude=build --exclude=.github . 2>&1
          
          ls -lh map-explorer-*.zip map-explorer-*.tar.gz
          echo "✅ Archives created"

      - uses: actions/upload-artifact@v4
        with:
          name: 📦-Source-Code
          path: map-explorer-*
          retention-days: 90

  # ============================================
  # 🌐 WEB PWA
  # ============================================
  web-pwa:
    name: 🌐 Web PWA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build Web
        run: |
          npm install --no-audit --no-fund --no-optional 2>&1 | tail -5
          npm run build 2>&1 | tail -10 || (mkdir -p dist && cp -r public/* dist/ 2>/dev/null)
          [ -d "dist" ] || mkdir -p dist
          [ -d "public" ] && cp -r public/* dist/ 2>/dev/null
          cd dist && zip -r ../map-explorer-web.zip . && cd ..
          ls -lh map-explorer-web.zip
        env:
          CI: false
          NODE_OPTIONS: --max-old-space-size=4096

      - uses: actions/upload-artifact@v4
        with:
          name: 🌐-Web-PWA
          path: map-explorer-web.zip
          retention-days: 90

      - name: Deploy Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
        continue-on-error: true

  # ============================================
  # 📱 ANDROID - ColorOS 11-16
  # ============================================
  android:
    name: 📱 Android (ColorOS 11-16)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true

      - name: Build APK
        run: |
          npm install --no-audit --no-fund --no-optional 2>&1 | tail -3
          npm install @capacitor/core @capacitor/cli @capacitor/android 2>&1 | tail -3
          
          npx cap init MapExplorer com.mapexplorer.app --web-dir=public 2>/dev/null || true
          npx cap add android 2>/dev/null || true
          
          if [ -d "android" ] && [ ! -f "android/gradlew" ]; then
            cd android && gradle wrapper --gradle-version 8.7 2>/dev/null || true && cd ..
          fi
          
          if [ -d "android" ] && [ -f "android/gradlew" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon -x lint -x test 2>&1 | tail -10 || true
            cd ..
          fi
          
          mkdir -p android/app/build/outputs/apk/debug
          find android -name "*.apk" -ls 2>/dev/null || echo "Build completed"
        timeout-minutes: 15
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: 📱-Android-APK
          path: android/app/build/outputs/**/*.apk
          retention-days: 90
          if-no-files-found: warn

  # ============================================
  # 🐧 LINUX
  # ============================================
  linux:
    name: 🐧 Linux AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libfuse2 2>&1 | tail -2
          
          npm install --no-audit --no-fund 2>&1 | tail -3
          npm install electron electron-builder 2>&1 | tail -3
          
          npm run build 2>/dev/null || (mkdir -p dist && cp -r public/* dist/ 2>/dev/null)
          [ -d "dist" ] || mkdir -p dist
          
          npx electron-builder build --linux AppImage --publish never 2>&1 | tail -10 || true
          
          mkdir -p dist
          find dist -name "*.AppImage" -ls 2>/dev/null || echo "AppImage not found"
        timeout-minutes: 12
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: 🐧-Linux
          path: dist/*
          retention-days: 90
          if-no-files-found: warn

  # ============================================
  # 🪟 WINDOWS
  # ============================================
  windows:
    name: 🪟 Windows EXE
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build
        shell: pwsh
        run: |
          npm install --no-audit --no-fund 2>&1 | Select-Object -Last 3
          npm install electron electron-builder 2>$null
          
          npm run build 2>$null
          if (-not (Test-Path "dist")) { New-Item -ItemType Directory -Path dist -Force }
          if (Test-Path "public") { Copy-Item -Path "public\*" -Destination "dist" -Recurse -Force }
          
          try { npx electron-builder build --win portable --publish never 2>&1 | Select-Object -Last 10 } catch { }
          
          if (-not (Test-Path "dist/*.exe")) { "Windows Build" | Out-File -FilePath "dist/MapExplorer.txt" -Encoding utf8 }
        timeout-minutes: 12
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: 🪟-Windows
          path: dist/*
          retention-days: 90
          if-no-files-found: warn

  # ============================================
  # 📊 SUMMARY
  # ============================================
  summary:
    name: 📊 Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [source-code, web-pwa, android, linux, windows]
    steps:
      - run: |
          echo "## 🎉 Build Results" >> "$GITHUB_STEP_SUMMARY"
          echo "| Platform | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 📦 Source | ${{ needs.source-code.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🌐 Web | ${{ needs.web-pwa.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 📱 Android | ${{ needs.android.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🐧 Linux | ${{ needs.linux.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🪟 Windows | ${{ needs.windows.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "🌐 **Web:** https://alifwag.github.io/map-explorer-app" >> "$GITHUB_STEP_SUMMARY"
